version: '3.8'

services:
  # 1. Main Express HTTP API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cctv_backend_api
    ports:
      - "5000:5000"
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=5000
      - API_PREFIX=/api/v1
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=https://admin.saburisecurity.in,http://localhost:5173,http://localhost:5174,http://localhost:3000,*
    mem_limit: 500m
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 2. Dedicated Production Background Worker Container (Chromium + BullMQ + Cloud PDF Generation)
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: cctv_backend_worker
    volumes:
      - ./src:/app/src
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
    mem_limit: 600m
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 3. Redis Service for BullMQ Queue & Caching (Named Volume Persistence)
  redis:
    image: redis:7-alpine
    container_name: cctv_backend_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    mem_limit: 100m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis_data:
    driver: local
